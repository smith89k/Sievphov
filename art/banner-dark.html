<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:520px;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#EEF3FA;
  background:
    radial-gradient(820px 460px at 50% 118%,rgba(167,139,250,.15),transparent 72%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/26px 26px,
    #0D1117;}
.page{width:100%;height:100%;padding:44px 56px 40px;display:flex;flex-direction:column}

h1{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1}
h1 .a{color:#A78BFA}
.sub{margin-top:12px;font-size:21px;font-weight:450;color:#919AA7;letter-spacing:-.012em}
.tag{font-size:25px;font-weight:700;letter-spacing:-.022em}
.tag .a{color:#A78BFA}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}

.win{background:#161B22;border:1px solid rgba(255,255,255,.10);border-radius:18px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.10);flex:0 0 auto}
.bar .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8B94A3;text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:#8B94A3;font-weight:500}
.pad{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.mono{font-family:'JetBrains Mono',Consolas,monospace;color:#D7DFEA}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#8B94A3;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);padding:5px 11px;
  border-radius:999px;white-space:nowrap}
.chip.on{color:#fff;background:#A78BFA;border-color:transparent}
.ok{display:inline-flex;align-items:center;gap:7px;background:rgba(63,185,80,.16);color:#4FC463;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.warn{background:rgba(240,160,60,.16);color:#F0A83C}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.muted{color:#919AA7}
.accent{color:#A78BFA}
.row{display:flex;align-items:center;gap:11px}
.grow{flex:1}
.logo{filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}

.queue{width:1000px;margin:0 auto}
.qr{display:flex;align-items:center;gap:14px;padding:12px 4px;font-size:14.5px}
.qr + .qr{border-top:1px solid rgba(255,255,255,.10)}
.qn{width:26px;height:26px;border-radius:50%;background:#A78BFA;color:#fff;font-size:12px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qf{font-family:'JetBrains Mono',Consolas,monospace;font-size:13.5px;color:#D7DFEA;width:206px}
.qp{color:#919AA7;font-size:13.5px;width:168px}
.stack{position:relative;width:146px;height:104px;flex:0 0 auto}
.stack i{position:absolute;left:14px;top:6px;width:92px;height:90px;border-radius:7px;
  background:#fff;border:1px solid rgba(0,0,0,.14);box-shadow:0 7px 18px rgba(0,0,0,.18)}

</style></head><body><div class="page">
<div class="mid"><div class="win queue"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="t">Print queue</span><span class="grow"></span><span class="chip on">108 sheets</span></div><div class="pad"><div class="row" style="align-items:center;gap:22px"><div class="grow"><div class="qr"><span class="qn">1</span><span class="qf">book-part-1.pdf</span><span class="qp">HP LaserJet &middot; Tray 2</span><span class="chip">Booklet</span><span class="grow"></span><span class="ok">42 sheets</span></div><div class="qr"><span class="qn">2</span><span class="qf">book-part-2.pdf</span><span class="qp">HP LaserJet &middot; Tray 2</span><span class="chip">Booklet</span><span class="grow"></span><span class="ok">44 sheets</span></div><div class="qr"><span class="qn">3</span><span class="qf">cover.pdf</span><span class="qp">Canon colour &middot; Tray 1</span><span class="chip">A4, one side</span><span class="grow"></span><span class="ok">4 sheets</span></div><div class="qr"><span class="qn">4</span><span class="qf">sastra-khmer.pdf</span><span class="qp">HP LaserJet &middot; Tray 3</span><span class="chip">A5 book</span><span class="grow"></span><span class="ok">18 sheets</span></div></div><div class="stack"><i style="transform:rotate(-9deg)"></i><i style="transform:rotate(4deg) translate(8px,0)"></i><i style="transform:translate(16px,-4px)"></i></div></div></div></div></div><div class="tag" style="text-align:center;margin-top:0px;flex:0 0 auto">One list. <span class="a">Many printers.</span> One click.</div>
</div></body></html>
