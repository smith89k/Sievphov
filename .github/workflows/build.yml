name: Build Windows app

# Runs only when started by hand (Actions → Build Windows app → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write # only used to publish test output to the ci/selftest branch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # the version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Print engine (C# tests + Sievphov.Engine.exe)
        run: pnpm run engine

      - name: JS tests (with the real engine)
        run: pnpm test

      - name: Window test (stand-in engine, screenshots)
        shell: pwsh
        run: |
          $env:SIEVPHOV_SHOTS = Join-Path $pwd 'selftest\screens'
          pnpm run test:ui

      - name: Self-test (prints sample books to Microsoft Print to PDF)
        shell: pwsh
        run: |
          $out = Join-Path $pwd 'selftest'
          $p = Start-Process -FilePath engine-dist/Sievphov.Engine.exe -ArgumentList '--selftest', "`"$out`"" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw 'Self-test timed out' }
          Get-Content (Join-Path $out 'selftest.log')
          if ($p.ExitCode -ne 0) { throw "Self-test failed with code $($p.ExitCode)" }

      - name: Installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Sievphov-Setup
          path: dist/Sievphov-Setup-*.exe

      # Keeps the latest screenshots, self-test pictures and printed PDFs on the ci/selftest branch for review.
      - name: Publish test output to ci/selftest branch
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path selftest)) { exit 0 }
          Set-Location selftest
          git init -q -b ci/selftest
          git config user.name "Sievphov CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Test output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci/selftest
